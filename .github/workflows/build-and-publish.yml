name: Build package and publish to PyPI
permissions: {}
on:
  push:
    tags:
      - 20* # Covers tags until year 2100.

jobs:
  build:
    name: Build wheel and sdist packages
    runs-on: ubuntu-latest

    steps:
    - uses: >- # v6.0.2
        actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: >- # v8.0.0
        astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Build
      run: |
        uv build
    - name: Upload dists
      uses: >- # v7.0.0
        actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-dists
        path: dist/

  pypi-publish:
    name: Publish wheel and sdist to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/drpg/
    needs:
      - build
    permissions:
      id-token: write
    steps:
    - name: Retrieve release distributions
      uses: >- # v8.0.1
        actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-dists
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  gh-release:
    name: Publish on GitHub
    runs-on: ubuntu-latest
    needs:
      - build
    env:
      # These stop SonarCloud S8544/S8541
      # See also https://gitub.com/astral-sh/uv/issues/17416
      UV_NO_BUILD: 1
      UV_NO_BINARY_PACKAGE: drpg
      UV_LOCKED: 1
    steps:
    - uses: >- # v6.0.2
        actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Retrieve release distributions
      uses: >- # v8.0.1
        actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-dists
        path: dist/
    - uses: >- # v8.0.0
        astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Install build dependencies
      run: |
        uv sync --group build
    - name: Build Linux binary
      run: |
        uv run pyinstaller pyinstaller-linux.spec
    - name: Create GitHub release
      uses: >- # v2.6.1
        softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
      with:
        generate_release_notes: true
        make_latest: true
        draft: false
        files: |
          dist/drpg-${{github.ref_name}}-py3-none-any.whl
          dist/drpg-${{github.ref_name}}.tar.gz
          dist/drpg-linux-x86_64

  docker-publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: write
    steps:
    - uses: >- # v6.0.2
        actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Docker Buildx
      uses: >- # v4.3.0
        docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

    - name: Log in to GitHub Container Registry
      uses: >- # v4.6.0
        docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: >- # v6.2.0
        docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=tag

    - name: Build and push Docker image
      uses: >- # v7.3.0
        docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
